name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      VITE_API_URL: http://127.0.0.1:3000/api
      PORT: '3000'
      FRONTEND_ORIGIN: http://127.0.0.1:5173
      DATABASE_URL: file:./.test-data/ci.db
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js y caché de npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Mostrar versiones
        run: |
          node --version
          npm --version

      - name: Instalar dependencias desde el lockfile
        run: npm ci

      - name: Revisar lint
        run: npm run lint

      - name: Revisar formato
        run: npm run format:check

      - name: Validar OpenAPI
        run: npm run docs:validate

      - name: Comprobar tipos y generar el cliente Prisma
        run: npm run typecheck

      - name: Ejecutar todas las pruebas
        env:
          NODE_ENV: test
        run: npm test

      - name: Compilar frontend y backend
        env:
          NODE_ENV: production
        run: npm run build --workspaces
